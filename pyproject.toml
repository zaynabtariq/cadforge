[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadforge"
version = "0.1.0"
description = "Auditable skill-learning agents for editable engineering CAD"
requires-python = ">=3.11"
dependencies = ["cadquery>=2.6,<3", "pydantic>=2.12,<3", "trimesh>=5.1,<6", "numpy>=1.26,<3", "scipy>=1.14,<2", "packaging>=24,<27"]

[project.optional-dependencies]
ui = ["marimo>=0.15,<1"]
studio = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "manifold3d>=3.5,<4", "python-dotenv>=1,<2"]
observability = ["weave>=0.51,<1", "mcp>=2.2,<3"]
agents = ["pydantic-ai>=2.43,<3"]
dev = ["pytest>=8,<10"]
fea = ["gmsh>=4.15,<5"]

[project.scripts]
cadforge = "cadforge.cli:main"
cadforge-studio = "cadforge.studio_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/cadforge"]

[tool.hatch.build.targets.wheel.force-include]
"studio/dist" = "cadforge/static"
