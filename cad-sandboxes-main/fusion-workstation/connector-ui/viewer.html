<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fusion · Workspace</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body class="viewer-page"><div class="app-shell">
<header class="topbar viewer-topbar"><div class="model-heading"><a class="back-link" href="./" aria-label="Back to connection"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></a><span id="model-name">Untitled model</span></div><label class="target-control"><span>Workstation</span><select id="target" aria-label="Workstation"><option value="primary">Original VM</option><option value="fresh">Fresh VM</option></select></label></header>
<main class="viewer-stage" id="viewer-stage" aria-label="Model workspace">
<div id="viewport"></div><div class="viewport-label"><i></i><span id="revision-label">No snapshot yet</span></div>
<aside id="parts-panel" class="parts-panel hidden" aria-label="Model parts">
<div class="parts-heading"><strong>Parts</strong><span id="parts-count">0</span></div>
<ul id="parts-list" class="parts-list" aria-label="Hover or focus a part to highlight it"></ul>
</aside>
<nav class="tool-rail" aria-label="View controls">
<button class="tool" id="fit" title="Fit model (F)" aria-label="Fit model"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 8h8v8H8Z"/></svg></button>
<button class="tool" id="iso" title="Isometric view" aria-label="Isometric view"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Zm0 9 8-4.5M12 12 4 7.5M12 12v9"/></svg></button>
<button class="tool" id="top" title="Top view" aria-label="Top view"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1"/><path d="M9 2h6M12 8v8m-4-4h8"/></svg></button>
<div class="rail-divider" aria-hidden="true"></div>
<button class="tool" id="grid" title="Toggle grid" aria-label="Toggle grid" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v18m8-18v18M3 8h18M3 16h18"/></svg></button>
<button class="tool" id="wireframe" title="Toggle wireframe" aria-label="Toggle wireframe" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 16H3L12 3Zm0 0v10m-9 6 9-6 9 6M7.5 11h9"/></svg></button>
</nav>
<div id="empty-state" class="viewer-empty"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Zm0 9 8-4.5M12 12 4 7.5M12 12v9"/></svg><strong>Your model goes here.</strong><p>Waiting for the next model update.</p></div>
<div class="view-axis" aria-hidden="true"><svg viewBox="0 0 48 48"><g data-axis="x"><line x1="24" y1="24" x2="24" y2="24"/><text text-anchor="middle">X</text></g><g data-axis="y"><line x1="24" y1="24" x2="24" y2="24"/><text text-anchor="middle">Y</text></g><g data-axis="z"><line x1="24" y1="24" x2="24" y2="24"/><text text-anchor="middle">Z</text></g></svg></div>
<div class="gesture-hint">Drag to orbit · Scroll to zoom</div>
<footer class="viewport-footer"><div class="model-info"><strong id="dimensions">Millimeters</strong><span id="status" role="status">Waiting for a model</span></div></footer>
</main></div><script type="module" src="viewer.js"></script></body></html>
